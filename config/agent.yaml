llm:
  base_url: "http://localhost:8088/v1"
  api_key: "not-needed"
  temperature: 0.1
  max_tokens: 2000
  provider: "gemini" # Options: "local" (default), "gemini". Override with LLM_PROVIDER env var
  gemini_model: "gemini-3-flash-preview" # Used when provider=gemini
  title_cache_max_size: 10000

mcp_server:
  host: "localhost"
  port: 3000

linkedin:
  email: "" # or use LINKEDIN_EMAIL env var
  password: "" # or use LINKEDIN_PASSWORD env var

browser:
  headless: false
  use_undetected: true
  browser_type: "chrome"
  chrome_version: 143 # Force ChromeDriver to match Chrome 143
  # chrome_binary_path: "/usr/bin/google-chrome"  # Uncomment to specify Chrome binary

outreach:
  dataset_path: "./data/free_company_dataset.csv"
  db_path: "./data/companies.db"
  message_template_path: ""
  message_template: ""
  employees_per_company: 50
  daily_message_limit: 50
  delay_between_messages_min: 30.0
  delay_between_messages_max: 120.0
  filters:
    industry: []
    country: []
    size: []

cv:
  file_path: "./data/cv_data.json"

kafka:
  bootstrap_servers: "localhost:9092"

api:
  host: "0.0.0.0"
  port: 8080

db:
  url: "sqlite:///./data/agent.db"
  company_url: "sqlite:///./data/companies.db"

observability:
  langfuse_enabled: false
  log_level: "INFO"

memory:
  threshold_percent: 80.0  # Circuit breaker triggers when RAM usage exceeds this %

linkedin_api:
  client_id: ""       # or use LINKEDIN_API_CLIENT_ID env var
  client_secret: ""   # or use LINKEDIN_API_CLIENT_SECRET env var
  redirect_uri: "http://localhost:8080/api/oauth/linkedin/callback"
  scopes:
    - "w_member_social"
    - "w_organization_social"
    - "r_organization_social"
    - "rw_organization_admin"
  organization_urn: ""  # e.g. "urn:li:organization:12345"

campaign:
  default_sentiments:
    - "authority"
    - "curiosity"
    - "educational"
    - "empathy"
    - "urgency"
  max_variants: 5
  poll_interval_hours: 6.0
  post_stagger_minutes_min: 15.0
  post_stagger_minutes_max: 30.0
  token_expiry_warning_days: 7
